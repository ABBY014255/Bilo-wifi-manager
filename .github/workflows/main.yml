name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Unzip project & install dependencies
        run: |
          if [ -f app.zip.zip ]; then unzip -o app.zip.zip; elif [ -f app.zip ]; then unzip -o app.zip; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm install --legacy-peer-deps
          npm run build
      - name: Generate Android project & allow HTTP router traffic
        run: |
          rm -rf android
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build and Sign APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
          cd ..
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass 123456 -keypass 123456 -dname "CN=Bilo, OU=Dev, O=Bilo, L=Dar, S=TZ, C=TZ"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks my-release-key.jks --ks-pass pass:123456 --key-pass pass:123456 --out Bilo-WiFi-Manager.apk app-aligned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilo-WiFi-Manager-APK
          path: Bilo-WiFi-Manager.apk
