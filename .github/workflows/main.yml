name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip project & install dependencies
        run: |
          if [ -f app.zip.zip ]; then unzip -o app.zip.zip; elif [ -f app.zip ]; then unzip -o app.zip; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm install --legacy-peer-deps
          npm run build
      - name: Generate Android project & allow HTTP router traffic
        run: |
          rm -rf android
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilo-WiFi-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
